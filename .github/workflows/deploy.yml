name: Deploy to Cloudflare Workers

# DISABLED (kept for later): this repo is currently deployed via
# Cloudflare's own "Connect to Git" integration (Workers Builds), which
# builds and deploys directly from Cloudflare's side on every push to
# main — no GitHub secrets involved. This workflow duplicates that, and
# would fail if it ran since CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# are not set as repo secrets. `workflow_dispatch` means it only runs if
# someone manually clicks "Run workflow" in the Actions tab — nothing
# triggers it automatically. To re-enable automatic runs, restore:
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
# and add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID under
# Settings → Secrets and variables → Actions.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build with OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          # Non-secret build-time vars go here; secrets are injected at
          # deploy/runtime via Wrangler, not at build time.
          NEXT_PUBLIC_APP_ENV: production

      # Manual-only now (see note above) — deploy step always runs when
      # someone manually triggers this workflow.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
